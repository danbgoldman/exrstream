<!doctype html>
<meta charset="utf-8">
<title>exrstream spike</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111; color:#ddd; font:13px system-ui,sans-serif; }
  header { padding:8px 12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;
           border-bottom:1px solid #333; }
  canvas { display:block; max-width:100%; height:auto; background:#000; }
  label { display:flex; gap:8px; align-items:center; }
  input[type=range] { width:260px; }
  #stats { font-family:ui-monospace,monospace; white-space:pre; padding:8px 12px;
           border-top:1px solid #333; line-height:1.5; }
  .k { color:#7ec; }
  button { background:#222; color:#ddd; border:1px solid #444; padding:4px 10px;
           border-radius:4px; cursor:pointer; }
</style>
<header>
  <button id="play">play</button>
  <label>exposure <input id="ev" type="range" min="-8" max="8" step="0.05" value="0">
    <span id="evv" class="k">0.00</span> EV</label>
  <label>frame <input id="fr" type="range" min="0" max="0" step="1" value="0"></label>
  <label>buffer <input id="buf" type="range" min="1" max="16" step="1" value="6">
    <span id="bufv" class="k">6</span></label>
  <span id="conn" class="k">connecting…</span>
</header>
<canvas id="c"></canvas>
<div id="stats">waiting for first frame…</div>
<script>
const $ = s => document.querySelector(s);

// WebCodecs is [SecureContext]: VideoDecoder simply does not exist over plain
// http to a LAN/Tailscale IP. localhost is exempt, so an SSH tunnel is the fix.
if (!window.VideoDecoder) {
  document.body.innerHTML =
    `<div style="padding:24px;line-height:1.6;font:14px system-ui">
      <h2>WebCodecs unavailable</h2>
      <p><code>VideoDecoder</code> is undefined here.
      secureContext=<b>${window.isSecureContext}</b>, origin=<code>${location.origin}</code></p>
      <p>WebCodecs requires a secure context. <code>localhost</code> counts; a bare
      LAN or Tailscale IP over http does not. Forward the port and use localhost:</p>
      <pre style="background:#1a1a1a;padding:12px;border-radius:6px">ssh -L 8099:localhost:8099 ${location.hostname}
# then open http://localhost:8099/</pre>
    </div>`;
  throw new Error("no WebCodecs");
}
const cv = $("#c"), ctx = cv.getContext("2d", { alpha:false, desynchronized:true });
let ws, dec, epoch = 0, pending = null, info = null;
let painted = 0, decodeMs = 0, reported = 0;
const lat = [];                        // slider -> painted, ms

// Presentation clock. Painting each frame the moment it decodes is what makes
// the slider feel instant, and it is exactly why playback judders: arrival
// jitter becomes display jitter. So playback drains through a small queue on a
// steady clock, while a frame answering a slider move jumps the queue.
const q = [];                          // decoded VideoFrames awaiting present
let TARGET_Q = 6;                      // frames of jitter absorbed
let nextPresent = 0, underruns = 0, playing = false;
let lastArrival = 0; const gaps = [];  // inter-arrival, to prove the diagnosis

// Refreshes-per-painted-frame. 24fps on 60Hz CANNOT be even: 41.7/16.67 = 2.5,
// so a healthy stream shows a clean alternating 2,3,2,3. Anything erratic means
// jitter or underruns instead, which is a different problem with a different
// fix. This histogram is what tells the two apart.
const cadence = new Map();
let ticksSincePaint = 0, lastStats = 0;
// Counting refreshes is only meaningful if rAF actually runs at display rate.
// Compositing a 2K canvas can throttle it, in which case "1 refresh apart" IS
// 41.7ms and the histogram measures nothing. Measure milliseconds instead.
const rafGaps = [], paintGaps = [], idleRaf = [];
let lastRaf = 0, lastPaint = 0;

function pct(a, p) {
  if (!a.length) return NaN;
  const s = [...a].sort((x,y)=>x-y);
  return s[Math.min(s.length-1, Math.floor(s.length*p/100))];
}

function setupDecoder() {
  dec = new VideoDecoder({
    output: frame => {
      const now = performance.now();
      if (lastArrival) { gaps.push(now - lastArrival); if (gaps.length > 300) gaps.shift(); }
      lastArrival = now;

      // Paused: paint immediately, so a slider drag is as snappy as possible.
      // Playing: queue it like any other frame. Jumping the queue per exposure
      // event tore down the presentation buffer ~60x/sec and made playback
      // janky during a drag, and it bought nothing -- exposure is applied to
      // the next scheduled frame regardless, i.e. within one frame period.
      if (!playing) { flushQueue(); paint(frame); render_stats(); return; }
      q.push(frame);
      if (q.length > TARGET_Q + 6) paint(q.shift());   // hard cap on added latency
    },
    error: e => { $("#stats").textContent = "decoder error: " + e; }
  });
  dec.configure({
    codec: info.codec,
    optimizeForLatency: true,
    hardwareAcceleration: "no-preference",
    // no `description` => Annex-B bitstream, which is what NVENC emits
  });
}

function paint(frame) {
  const ep = frame.timestamp;                 // epoch we stamped server-side
  if (pending && ep >= pending.epoch) {
    lat.push(performance.now() - pending.t0);
    if (lat.length - reported >= 10) {
      reported = lat.length;
      ws.send(JSON.stringify({ type:"report", ms: pct(lat,50), decode: decodeMs,
                               jitter: pct(gaps,95), underruns,
                               paint50: pct(paintGaps,50), paint95: pct(paintGaps,95),
                               raf50: pct(rafGaps,50), q: q.length }));
    }
    pending = null;
  }
  if (cv.width !== frame.displayWidth) {
    cv.width = frame.displayWidth; cv.height = frame.displayHeight;
  }
  ctx.drawImage(frame, 0, 0);
  frame.close();
  painted++;
  const pnow = performance.now();
  if (lastPaint && playing) { paintGaps.push(pnow - lastPaint); if (paintGaps.length > 300) paintGaps.shift(); }
  lastPaint = pnow;
  if (playing && ticksSincePaint) {
    cadence.set(ticksSincePaint, (cadence.get(ticksSincePaint) || 0) + 1);
  }
  ticksSincePaint = 0;
}
function flushQueue() { while (q.length) q.shift().close(); }

function tick(ts) {
  requestAnimationFrame(tick);
  // Measure rAF ALWAYS, not just while playing: an idle page pinned at 30Hz
  // means the display is throttled (ProMotion / Low Power Mode) and no amount
  // of buffering helps. 60Hz idle dropping to 30Hz under load would instead
  // mean our own canvas compositing is the bottleneck.
  if (lastRaf) {
    const g = ts - lastRaf;
    (playing ? rafGaps : idleRaf).push(g);
    if (rafGaps.length > 300) rafGaps.shift();
    if (idleRaf.length > 120) idleRaf.shift();
  }
  lastRaf = ts;
  if (!playing || !info) { if (ts - lastStats > 400) { lastStats = ts; render_stats(); } return; }
  ticksSincePaint++;

  // Adaptive period. The server clock and this clock are independent and always
  // drift; arrival p50 41.8 vs a nominal 41.67 drain is enough to erode the
  // whole buffer to zero, after which every jitter spike underruns. So track
  // the queue depth: run slightly slow when short, slightly fast when deep.
  const nominal = 1000 / info.fps;
  const err = (TARGET_Q - q.length) / Math.max(TARGET_Q, 1);
  const period = nominal * (1 + Math.max(-0.10, Math.min(0.10, 0.06 * err)));

  // Hard resync. Without this the clock can fall permanently behind: adding one
  // period to an already-past deadline leaves it in the past, so every single
  // rAF tick paints and the queue drains at refresh rate instead of frame rate
  // (seen as refreshes/frame 1x dominating, then underruns, then a burst).
  if (nextPresent && ts - nextPresent > 2 * period) nextPresent = ts;

  if (!nextPresent) {                                  // prime the buffer first
    if (q.length >= TARGET_Q) { nextPresent = ts; } else { return; }
  }
  if (ts >= nextPresent) {
    if (q.length) {
      paint(q.shift());
      nextPresent += period;
    } else {
      underruns++;
      nextPresent += period;                           // slip a beat, hold frame
    }
  }
  if (ts - lastStats > 250) { lastStats = ts; render_stats(); }
}
requestAnimationFrame(tick);

function render_stats() {
  const period = info ? 1000 / info.fps : 41.7;
  const cad = [...cadence.entries()].sort((a,b)=>a[0]-b[0])
                .map(([k,v]) => `${k}x:${v}`).join("  ") || "-";
  $("#stats").textContent =
    `painted ${painted}   present queue ${q.length}   decoder queue ${dec ? dec.decodeQueueSize : "-"}   underruns ${underruns}\n` +
    `slider -> painted   p50 ${pct(lat,50).toFixed(1)} ms   p95 ${pct(lat,95).toFixed(1)} ms   n=${lat.length}\n` +
    `arrival gap  p50 ${pct(gaps,50).toFixed(1)}  p95 ${pct(gaps,95).toFixed(1)}  max ${gaps.length?Math.max(...gaps).toFixed(1):"-"} ms   (target ${period.toFixed(1)})\n` +
    `paint gap    p50 ${pct(paintGaps,50).toFixed(1)}  p95 ${pct(paintGaps,95).toFixed(1)}  max ${paintGaps.length?Math.max(...paintGaps).toFixed(1):"-"} ms   (target ${period.toFixed(1)})\n` +
    `rAF playing  p50 ${pct(rafGaps,50).toFixed(1)} ms -> ${rafGaps.length?(1000/pct(rafGaps,50)).toFixed(0):"-"} Hz` +
    `    rAF idle  p50 ${pct(idleRaf,50).toFixed(1)} ms -> ${idleRaf.length?(1000/pct(idleRaf,50)).toFixed(0):"-"} Hz\n` +
    `buffer ${TARGET_Q}   ${info ? info.w+"x"+info.h+" "+info.codec+" @"+info.fps : ""}`;
}

function connect() {
  // wss when the page is https (tailscale serve), ws otherwise
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => $("#conn").textContent = "connected";
  ws.onclose = () => $("#conn").textContent = "disconnected";
  ws.onmessage = ev => {
    if (typeof ev.data === "string") {
      info = JSON.parse(ev.data);
      $("#fr").max = info.frames - 1;
      setupDecoder();
      return;
    }
    const dv = new DataView(ev.data);
    const frameIdx = dv.getUint32(0, true);
    const ep       = dv.getUint32(4, true);
    const isKey    = dv.getUint32(12, true) === 1;
    const payload  = new Uint8Array(ev.data, 16);
    const t = performance.now();
    try {
      dec.decode(new EncodedVideoChunk({
        type: isKey ? "key" : "delta",
        timestamp: ep,                  // reuse timestamp to carry the epoch
        data: payload
      }));
    } catch (e) { $("#stats").textContent = "decode() threw: " + e; return; }
    decodeMs = performance.now() - t;
    ws.send(JSON.stringify({ type:"ack", frame: frameIdx }));
  };
}

$("#ev").addEventListener("input", e => {
  const v = parseFloat(e.target.value);
  $("#evv").textContent = v.toFixed(2);
  epoch++;
  pending = { epoch, t0: performance.now() };
  ws.send(JSON.stringify({ type:"exposure", ev: v, epoch }));
});
$("#fr").addEventListener("input", e =>
  ws.send(JSON.stringify({ type:"seek", frame: +e.target.value })));
$("#play").addEventListener("click", () => {
  playing = !playing;
  if (!playing) { flushQueue(); nextPresent = 0; }
  $("#play").textContent = playing ? "pause" : "play";
  ws.send(JSON.stringify({ type:"play", on: playing }));
});
$("#buf").addEventListener("input", e => {
  TARGET_Q = +e.target.value; $("#bufv").textContent = TARGET_Q;
  cadence.clear(); underruns = 0;
});
connect();
</script>
